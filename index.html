 !","Communication visuelle superbe !","Composition moderne et élégante !","Utilisation brillante de la couleur !","Design très inspirant !","Résultat professionnel et soigné !","Mise en page créative et percutante !","Design harmonieux et équilibré !","Qualité graphique exceptionnelle !","Visuel marquant et mémorable !","Harmonie parfaite des formes et couleurs !","Style innovant et raffiné !","Message clair et puissant !","Esthétique sophistiquée et épurée !","Mise en page impressionnante !","Couleurs vibrantes et bien équilibrées !","Lignes épurées et style moderne !","Exécution professionnelle !","Visuel captivant et élégant !","Design magnifiquement structuré !","Composition magistrale !"],ri=["Jean Muse","Grace K.","Samuel T.","Aline N.","David M.","Esther B.","Patrick R.","Marie-Claire","Joseph K.","Ines U.","Thierry N.","Diane A.","Eric S.","Fatou D.","Lucie P.","Benoit L.","Nadine I.","Olivier G.","Chantal M.","Robert H.","Claudine K.","Yves B.","Sandrine U.","Christian N.","Anitha J.","Frank O."],lA=["I approach every design with professionalism, clarity and purpose, and I build each composition around the message it must deliver. My work reflects expertise, care and a strong sense of identity, so every piece feels refined, credible and memorable.","Great design is not decoration, it is communication, and layout, color and typography are used to make ideas clear and powerful. The portfolio shows this philosophy in action, with designs that are elegant, balanced and built to last.","I bring years of know how and a disciplined creative process to every project, from first concept to final delivery. The result is work that feels professional, consistent and adapted to every audience.","Listening comes first, then design, because understanding the vision is what makes a design truly effective. This approach allows visuals to feel personal, authentic and perfectly aligned with each need.","I focus on details that others often miss, like spacing, hierarchy and visual rhythm, and I refine them until everything feels right. That attention to detail is what gives the work its polished and professional character.","Every design is an opportunity to build trust, and each piece is crafted to inspire confidence and respect. The portfolio reflects that commitment to quality, excellence and timeless visual language.","I combine creativity with strategy, so my designs are not only beautiful but also useful and meaningful. Each composition is built to communicate clearly and to leave a strong and lasting impression.","Passion and professionalism are used in equal measure, and every project is treated as a signature piece. That is why the designs carry a distinct personality that clients and audiences remember.","I have developed expertise across many kinds of design, and I adapt my style to suit each context without losing coherence. This versatility makes the portfolio relevant for brands, events, institutions and individuals alike.","Clean, modern and purposeful design is the goal, and everything unnecessary is removed to let the essential message shine. The result is work that is easy to understand, pleasant to look at and hard to forget.","I start each project with research and reflection, then I translate ideas into strong visual forms. My method ensures that every design is intentional, original and grounded in real communication goals.","Originality is valued above imitation, and each design is built from a fresh concept rather than a template. This is how the portfolio maintains a unique voice and a high standard of creativity.","I use color with intention, choosing palettes that support emotion, clarity and brand identity. My expertise in color harmony gives each design depth, energy and professional balance.","Typography is treated as a voice, not just letters, and typefaces are selected to reinforce tone and readability. This careful choice makes every design feel confident, elegant and well structured.","I design for all formats and all audiences, ensuring that each piece remains clear, sharp and impactful everywhere. My work is flexible, scalable and ready for both print and digital use.","Commitment to excellence is present in every pixel, and each composition is reviewed until it meets the highest standard. That discipline is the foundation of the professionalism seen across the portfolio.","I bring a personal touch to professional work, so each design feels human, warm and alive. This balance between personality and professionalism is what defines the creative signature.","Visual hierarchy is built to work in seconds, guiding the eye naturally through strong structure. The portfolio demonstrates this expertise through clear, impactful and memorable compositions.","I transform complex ideas into simple, elegant visuals, and I make communication feel effortless. This ability to simplify without losing meaning is at the heart of my know how.","The audience stays at the center, because a design succeeds only when people understand and feel it. Work is therefore created to connect, to engage and to inspire action.","I take pride in delivering work that is both artistic and strategic, beautiful and purposeful. Each project in the portfolio reflects that dual commitment to creativity and results.","Visual identities are built to be strong, coherent and adaptable, and every element works together as one system. This systemic thinking gives designs consistency and long term value.","I pay attention to balance, proportion and rhythm, and I use them to create harmony in every layout. That sense of order is what makes designs feel professional and reassuring.","Each brief is approached with curiosity and respect, and many directions are explored before selecting the strongest one. This process guarantees originality and a solution that truly fits the need.","I believe professionalism is shown in consistency, and I apply the same rigor to small details and large compositions. The portfolio is a proof of that constant pursuit of quality.","Designs are created to speak without shouting, using subtlety, elegance and confident restraint. This refined approach allows the message to stand out with clarity and class.","I have learned to adapt to different cultures, contexts and expectations, and I design with sensitivity and openness. This makes the work suitable for a wide range of clients and projects.","Expertise is used to solve visual problems, not just to decorate, and the focus stays on what the design must achieve. That problem solving mindset is what makes the portfolio both creative and practical.","I treat every project as a collaboration, and I value clear communication throughout the creative process. This professionalism ensures smooth delivery and results that exceed expectations.","Passion for visual communication is channeled into precise, thoughtful design. The portfolio shows how passion, when guided by expertise, becomes powerful communication.","I design with the future in mind, creating work that remains relevant, modern and timeless. This long term vision protects the value of each design well beyond its first publication.","Simplicity is the result of deep know how and careful refinement, and compositions are crafted to be easy to navigate and pleasant to experience. That simplicity gives each piece clarity and elegance.","I bring structure to creativity, organizing ideas into clear, coherent and compelling visuals. My method allows imagination to flourish within a professional framework.","A lasting impression is the goal, because a great design should be remembered long after it is seen. The portfolio is built around that ambition to create memorable visual experiences.","I work to elevate every brand and every message I touch, and I bring the same level of care to each project. This dedication is visible in the quality and consistency of the work.","Versatility is essential, and pieces are designed to work across platforms, sizes and contexts. Expertise ensures that quality never depends on format.","I combine intuition and experience, letting creativity lead while professionalism guides every decision. This balance gives designs both soul and structure.","Time is taken to polish every composition, because final details are what transform good design into great design. That patience and precision define the professional approach.","I create with integrity, ensuring that each design is original, honest and respectful of its purpose. The portfolio reflects that ethical and professional commitment.","Craft is constantly refined, learning new techniques and staying aware of contemporary visual trends. This continuous growth keeps the work fresh, relevant and innovative.","I design to build connection, using visuals that feel welcoming, clear and human. The portfolio shows how design can bring people closer to ideas, brands and stories.","Every visual has a clear intention, and no element exists without a reason. This intentional approach gives designs clarity, strength and meaning.","I bring confidence to my work through preparation, and I back every creative choice with reasoning and experience. Clients can trust that designs are not random, they are designed.","Feedback and dialogue are valued, because great design grows through exchange and understanding. This open and professional attitude makes collaboration smooth and productive.","I create designs that respect both tradition and modernity, blending timeless principles with contemporary expression. This balance makes the work suitable for any kind of project.","Quality is preferred over quantity, and one strong, refined design is delivered rather than many weak ones. The portfolio reflects that selective and professional standard.","I use visual hierarchy, contrast and whitespace to create designs that breathe and communicate effortlessly. My expertise in these fundamentals gives every piece clarity and elegance.","The personality of the portfolio is a mix of passion, discipline and creativity. It represents not just what is designed, but how thinking and working happen.","I design for impact and for longevity, creating visuals that attract attention immediately and retain value over time. This dual focus is the signature of professional expertise.","Design is seen as a responsibility, and that responsibility is honored by delivering work that is thoughtful, accurate and beautiful. The portfolio is an invitation to experience that commitment firsthand.","I keep every image in its original ratio, in preview and when published, so it looks better and remains unaltered. This respect for the original composition shows professionalism and care for visual quality.","Precision in layout creates a natural flow, and each element is placed with intention. The result is a composition that feels calm, clear and professional.","I study the message before choosing forms, colors and type, because meaning must lead aesthetics. This method ensures that beauty always serves communication.","Balance between boldness and restraint defines the style, and strong shapes are softened by clean spacing. The outcome is a design that feels confident without being heavy.","I build systems, not isolated visuals, so every element can evolve while staying coherent. This systemic expertise makes the work adaptable and durable.","Light, shadow and texture are used with subtlety to give depth without clutter. The result is a refined piece that feels modern and tactile.","I pay attention to how a design will be viewed on different devices, and I test readability at every size. That care ensures a flawless experience everywhere.","Emotion is translated into visual language through palette, rhythm and form. The final piece feels alive, warm and memorable.","I keep the process transparent, from first sketches to final delivery, so collaboration stays clear and trusted. This professionalism builds long term relationships.","Each project begins with a blank page and a clear question: what must this design make people feel and understand. The answer shapes every creative decision.","I refine until the composition feels effortless, even when the work behind it is complex. That effortlessness is the mark of true expertise.","Colors are chosen to support identity, not to distract, and palettes are built for harmony and contrast. The result is a visual that feels intentional and premium.","I respect the audience's time, so messages are made immediate, direct and easy to grasp. This clarity is central to effective visual communication.","Original elements are composed with care, and each shape, color and object has a role in the whole. The final composition feels unified and purposeful.","I explore many ideas, then keep only the strongest, because editing is part of creativity. This discipline keeps the portfolio sharp and focused.","Typography, spacing and alignment are treated as the backbone of every design. When these fundamentals are right, everything else falls into place.","I design to be understood across cultures, using universal visual principles and sensitive choices. This openness makes the work relevant in many contexts.","A strong concept is the starting point, and execution follows with patience and precision. The result is a design that is both meaningful and beautiful.","I value timelessness over trends, and I build visuals that will still feel fresh years from now. This long term thinking protects the client's investment.","Each design is tested for clarity, balance and impact before it is considered finished. That rigorous review guarantees professional quality.","I create visuals that invite the viewer in, with warmth, clarity and a clear focal point. The experience feels welcoming and confident.","Palette, shapes and objects are orchestrated to create rhythm and hierarchy. The composition guides the eye with ease and elegance.","I bring energy to every project, and that energy is visible in vibrant yet controlled compositions. The work feels alive without losing professionalism.","Details are polished until the design feels complete, with nothing missing and nothing excessive. This sense of completion is what makes the work memorable.","I listen to feedback with openness, and I refine with purpose rather than ego. This collaborative spirit improves every outcome.","Visual storytelling is used to turn ideas into images that people remember. Each design carries a narrative that is clear and engaging.","I build trust through consistency, delivering the same high standard on every project. That reliability is a core part of the portfolio's personality.","Space is used as a design element, giving compositions room to breathe. This use of whitespace creates elegance and focus.","I choose forms that are strong yet flexible, so designs can grow and adapt over time. This flexibility ensures long term relevance.","Creativity is grounded in method, and every spontaneous idea is tested against the brief. This balance keeps the work both imaginative and effective.","I aim for designs that feel both modern and human, with technology serving emotion. The result is work that connects on a personal level.","Each palette is built from the identity of the project, not from fashion alone. Colors therefore feel authentic and lasting.","I ensure that every design works in print and on screen, with colors and shapes that stay true. This technical expertise guarantees consistency.","The portfolio is curated to show range, from minimal compositions to rich, layered visuals. That range proves adaptability without losing identity.","I treat whitespace, alignment and proportion as tools for clarity. When they are mastered, the message becomes effortless to read.","A design should feel like it was inevitable, as if no other solution could be better. That sense of rightness is what is pursued in every project.","I bring a calm and focused approach to complex briefs, breaking them into clear visual steps. This method turns complexity into clarity.","Emotion, logic and aesthetics are balanced in every composition. The result is a design that is persuasive, beautiful and intelligent.","I use original elements to build distinct visual languages for each project. This originality prevents repetition and keeps the portfolio fresh.","Each design is crafted to be shared, remembered and valued, not just seen. That ambition drives the attention to quality in every piece.","I keep learning from each project, and each new design benefits from previous experience. This growth is visible across the portfolio.","Symbols and icons are designed to be instantly readable, with clean forms and clear meaning. This clarity makes communication faster and stronger.","I work with precision, but I never lose the human touch that makes design relatable. That combination is the heart of the portfolio.","Visual consistency is maintained across all touchpoints, so brands feel coherent and trustworthy. This expertise in systems strengthens identity.","I create designs that are easy to use and pleasant to experience, with the viewer always in mind. Usability and beauty are treated as partners.","Every project is an opportunity to learn something new about people and communication. That curiosity keeps the work evolving.","I build compositions that feel balanced even when they are bold, using contrast with control. The result is powerful yet refined.","The portfolio reflects a journey of passion, discipline and continuous improvement. Each piece tells a part of that story.","I ensure that images, text and space work together as one unified visual. No element competes, all cooperate.","Design decisions are explained with clarity, so clients understand the reasoning behind each choice. This transparency builds confidence.","I create visuals that respect the brand while pushing it forward with fresh ideas. This respectful innovation is a hallmark of the work.","Each design is made to be timeless in feeling, even when it uses contemporary tools. That timeless quality gives it lasting value.","I use rhythm and repetition to create cohesion, while introducing variation to keep interest. This dynamic balance keeps designs engaging.","The goal is always to make the complex feel simple and the simple feel special. That transformation is the essence of the craft.","I approach typography as architecture, building readable and elegant structures for words. This care makes messages feel solid and refined.","Colors, shapes and objects are selected to create a distinct mood for each project. The mood is always intentional and aligned with the message.","I design with empathy, imagining how different people will see and feel the work. This empathy makes the designs inclusive and welcoming.","Each visual is polished for both small screens and large displays, without loss of quality. Technical care ensures a perfect presentation everywhere.","I keep the portfolio honest, showing real work with real intentions behind each piece. That honesty is part of its personality.","A clear brief is turned into a clear visual, with no noise and no confusion. This clarity is the result of disciplined thinking.","I use contrast to create focus, and harmony to create comfort, balancing both in every layout. The outcome feels dynamic yet calm.","The creative process is both structured and open, allowing ideas to grow within a clear framework. This method produces original and reliable results.","I design pieces that can stand alone and also work as part of a larger system. This flexibility makes the work practical and powerful.","Each composition is reviewed for emotional impact, not just visual correctness. If it does not move the viewer, it is refined further.","I bring a sense of pride to every delivery, knowing that each design represents both the client and the creator. That pride drives quality.","Visual language is built to be clear in any context, from a small card to a large display. This scalability is a sign of professional expertise.","I create designs that feel personal to the client yet universal to the audience. That duality is a key strength of the portfolio.","Every detail, from the smallest icon to the overall layout, is considered with care. This thoroughness is what makes the work feel premium.","I use storytelling to give designs depth, so they are not just seen but remembered. Stories make visuals meaningful and lasting.","The portfolio shows a commitment to doing things properly, without shortcuts, from concept to final file. That integrity defines the work.","I adapt the tone of each design, from playful to formal, depending on the message and audience. This tonal flexibility proves true expertise.","Each piece is designed to be functional as well as beautiful, serving a real communication purpose. Beauty without purpose is never the goal.","I keep the focus on the essential, removing distractions so the core idea can shine. This minimal and confident approach creates impact.","Colors are tested in different lights and contexts to ensure they always feel right. This technical attention guarantees a professional finish.","I design with a long term perspective, imagining how the work will age and evolve. That foresight protects its relevance.","The portfolio is not just a collection, it is a statement of values: passion, creativity and professionalism. Each design embodies those values.","I ensure that every visual respects accessibility, with readable type and clear contrast. Inclusive design is part of professional responsibility.","Each project is treated as unique, with no formula repeated blindly. This bespoke approach keeps every design fresh and authentic.","I use shapes and objects to create visual metaphors that make ideas instantly understandable. This creative thinking adds depth to the work.","The work is driven by a desire to make communication better, clearer and more human. That desire is visible in every composition.","I build designs that feel confident, because confidence is built on preparation and expertise. The result is work that inspires trust.","Every palette, layout and type choice is documented in the mind as part of a coherent system. This systematic thinking ensures consistency.","I create visuals that can be loved at first sight and respected over time. That combination of instant appeal and lasting value is rare and intentional.","The portfolio invites the viewer to explore, to feel and to understand the thinking behind each design. It is an open window into a creative process.","I use restraint as a strength, knowing when to stop and when a design is complete. That judgment comes from experience and know how.","Each design is a dialogue between creator, client and audience, and that dialogue is honored in every decision. This collaborative spirit enriches the outcome.","I ensure that the original ratio of every image is preserved, so visuals stay true and unaltered. This technical respect shows professionalism.","A design must work hard, and each element is expected to earn its place. If it does not serve the message, it is removed.","I create with a focus on elegance, ensuring that even bold designs feel refined. Elegance is not about softness, it is about control.","The portfolio demonstrates an ability to move between styles while keeping a recognizable voice. That voice is passion, clarity and professionalism."],YA=["J'aborde chaque design avec professionnalisme, clarté et intention, et je construis chaque composition autour du message à transmettre. Mon travail reflète expertise, soin et identité forte, pour des pièces raffinées, crédibles et mémorables.","Le grand design n'est pas de la décoration, c'est de la communication, et la mise en page, la couleur et la typographie sont utilisées pour rendre les idées claires et puissantes. Le portfolio montre cette philosophie en action, avec des designs élégants, équilibrés et pensés pour durer.","J'apporte des années de savoir faire et un processus créatif discipliné à chaque projet, du premier concept à la livraison finale. Le résultat est un travail professionnel, cohérent et adapté à chaque public.","L'écoute vient d'abord, puis le design, car comprendre la vision est ce qui rend un design vraiment efficace. Cette approche permet aux visuels de paraître personnels, authentiques et parfaitement alignés avec chaque besoin.","Je me concentre sur des détails que d'autres manquent souvent, comme l'espacement, la hiérarchie et le rythme visuel, et je les affine jusqu'à ce que tout paraisse juste. Cette attention au détail donne au travail son caractère soigné et professionnel.","Chaque design est une opportunité de créer la confiance, et chaque pièce est conçue pour inspirer confiance et respect. Le portfolio reflète cet engagement pour la qualité, l'excellence et un langage visuel intemporel.","Je combine créativité et stratégie, pour que mes designs soient non seulement beaux mais aussi utiles et significatifs. Chaque composition est construite pour communiquer clairement et laisser une impression forte et durable.","La passion et le professionnalisme sont utilisés à parts égales, et chaque projet est traité comme une pièce signature. C'est pourquoi les designs portent une personnalité distincte que clients et publics retiennent.","J'ai développé une expertise dans de nombreux types de design, et j'adapte mon style à chaque contexte sans perdre de cohérence. Cette polyvalence rend le portfolio pertinent pour marques, événements, institutions et particuliers.","Le design propre, moderne et utile est l'objectif, et tout le superflu est retiré pour laisser le message essentiel briller. Le résultat est un travail facile à comprendre, agréable à regarder et difficile à oublier.","Je commence chaque projet par la recherche et la réflexion, puis je traduis les idées en formes visuelles fortes. Ma méthode garantit que chaque design est intentionnel, original et ancré dans de vrais objectifs de communication.","L'originalité est valorisée au-dessus de l'imitation, et chaque design est construit à partir d'un concept frais plutôt que d'un modèle. C'est ainsi que le portfolio garde une voix unique et un haut standard de créativité.","J'utilise la couleur avec intention, en choisissant des palettes qui soutiennent l'émotion, la clarté et l'identité de marque. Mon expertise en harmonie des couleurs donne à chaque design profondeur, énergie et équilibre professionnel.","La typographie est traitée comme une voix, pas seulement des lettres, et les polices sont choisies pour renforcer le ton et la lisibilité. Ce choix soigné rend chaque design confiant, élégant et bien structuré.","Je conçois pour tous les formats et tous les publics, en veillant à ce que chaque pièce reste claire, nette et impactante partout. Mon travail est flexible, évolutif et prêt pour l'impression et le numérique.","L'engagement pour l'excellence est présent dans chaque pixel, et chaque composition est revue jusqu'à atteindre le plus haut standard. Cette discipline est le fondement du professionnalisme visible dans le portfolio.","J'apporte une touche personnelle au travail professionnel, pour que chaque design paraisse humain, chaleureux et vivant. Cet équilibre entre personnalité et professionnalisme définit la signature créative.","La hiérarchie visuelle est construite pour fonctionner en quelques secondes, guidant le regard naturellement grâce à une structure forte. Le portfolio démontre cette expertise à travers des compositions claires, impactantes et mémorables.","Je transforme des idées complexes en visuels simples et élégants, et je rends la communication sans effort. Cette capacité à simplifier sans perdre le sens est au cœur de mon savoir faire.","Le public reste au centre, car un design ne réussit que lorsque les gens le comprennent et le ressentent. Le travail est donc créé pour connecter, engager et inspirer l'action.","Je suis fier de livrer un travail à la fois artistique et stratégique, beau et utile. Chaque projet du portfolio reflète ce double engagement pour la créativité et les résultats.","Les identités visuelles sont construites pour être fortes, cohérentes et adaptables, et chaque élément travaille ensemble comme un seul système. Cette pensée systémique donne aux designs cohérence et valeur durable.","Je fais attention à l'équilibre, aux proportions et au rythme, et je les utilise pour créer l'harmonie dans chaque mise en page. Ce sens de l'ordre rend les designs professionnels et rassurants.","Chaque brief est abordé avec curiosité et respect, et de nombreuses directions sont explorées avant de choisir la plus forte. Ce processus garantit l'originalité et une solution qui correspond vraiment au besoin.","Je crois que le professionnalisme se montre dans la cohérence, et j'applique la même rigueur aux petits détails et aux grandes compositions. Le portfolio est une preuve de cette quête constante de qualité.","Les designs sont créés pour parler sans crier, en utilisant subtilité, élégance et retenue confiante. Cette approche raffinée permet au message de se démarquer avec clarté et classe.","J'ai appris à m'adapter à différentes cultures, contextes et attentes, et je conçois avec sensibilité et ouverture. Cela rend le travail adapté à un large éventail de clients et de projets.","L'expertise est utilisée pour résoudre des problèmes visuels, pas seulement pour décorer, et le focus reste sur ce que le design doit accomplir. Cet esprit de résolution rend le portfolio à la fois créatif et pratique.","Je traite chaque projet comme une collaboration, et je valorise une communication claire tout au long du processus créatif. Ce professionnalisme assure une livraison fluide et des résultats qui dépassent les attentes.","La passion pour la communication visuelle est canalisée vers un design précis et réfléchi. Le portfolio montre comment la passion, guidée par l'expertise, devient une communication puissante.","Je conçois avec l'avenir en tête, créant un travail qui reste pertinent, moderne et intemporel. Cette vision à long terme protège la valeur de chaque design bien au-delà de sa première publication.","La simplicité est le résultat d'un savoir faire profond et d'un raffinement soigné, et les compositions sont conçues pour être faciles à parcourir et agréables à vivre. Cette simplicité donne à chaque pièce clarté et élégance.","J'apporte de la structure à la créativité, en organisant les idées en visuels clairs, cohérents et convaincants. Ma méthode permet à l'imagination de s'épanouir dans un cadre professionnel.","Une impression durable est l'objectif, car un grand design doit être retenu longtemps après avoir été vu. Le portfolio est construit autour de cette ambition de créer des expériences visuelles mémorables.","Je travaille à élever chaque marque et chaque message que je touche, et j'apporte le même niveau de soin à chaque projet. Ce dévouement est visible dans la qualité et la cohérence du travail.","La polyvalence est essentielle, et les pièces sont conçues pour fonctionner sur les plateformes, les tailles et les contextes. L'expertise garantit que la qualité ne dépend jamais du format.","Je combine intuition et expérience, laissant la créativité mener pendant que le professionnalisme guide chaque décision. Cet équilibre donne aux designs à la fois âme et structure.","Du temps est pris pour polir chaque composition, car les détails finaux transforment un bon design en grand design. Cette patience et cette précision définissent l'approche professionnelle.","Je crée avec intégrité, en veillant à ce que chaque design soit original, honnête et respectueux de son but. Le portfolio reflète cet engagement éthique et professionnel.","Le métier est constamment affiné, en apprenant de nouvelles techniques et en restant attentif aux tendances visuelles contemporaines. Cette croissance continue garde le travail frais, pertinent et innovant.","Je conçois pour créer du lien, en utilisant des visuels accueillants, clairs et humains. Le portfolio montre comment le design peut rapprocher les gens des idées, des marques et des histoires.","Chaque visuel a une intention claire, et aucun élément n'existe sans raison. Cette approche intentionnelle donne aux designs clarté, force et sens.","J'apporte de la confiance à mon travail grâce à la préparation, et je soutiens chaque choix créatif par le raisonnement et l'expérience. Les clients peuvent faire confiance, les designs ne sont pas aléatoires, ils sont pensés.","Les retours et le dialogue sont valorisés, car le grand design grandit par l'échange et la compréhension. Cette attitude ouverte et professionnelle rend la collaboration fluide et productive.","Je crée des designs qui respectent à la fois tradition et modernité, en mélangeant principes intemporels et expression contemporaine. Cet équilibre rend le travail adapté à tout type de projet.","La qualité est préférée à la quantité, et un design fort et raffiné est livré plutôt que beaucoup de faibles. Le portfolio reflète ce standard sélectif et professionnel.","J'utilise hiérarchie visuelle, contraste et espace blanc pour créer des designs qui respirent et communiquent sans effort. Mon expertise de ces fondamentaux donne à chaque pièce clarté et élégance.","La personnalité du portfolio est un mélange de passion, discipline et créativité. Elle représente non seulement ce qui est conçu, mais comment on pense et comment on travaille.","Je conçois pour l'impact et la longévité, créant des visuels qui attirent l'attention immédiatement et gardent leur valeur dans le temps. Ce double focus est la signature de l'expertise professionnelle.","Le design est vu comme une responsabilité, et cette responsabilité est honorée en livrant un travail réfléchi, précis et beau. Le portfolio est une invitation à vivre cet engagement de première main.","Je garde chaque image dans son ratio original, en aperçu et lors de la publication, pour qu'elle paraisse meilleure et reste inchangée. Ce respect de la composition originale montre professionnalisme et soin de la qualité visuelle.","La précision dans la mise en page crée un flux naturel, et chaque élément est placé avec intention. Le résultat est une composition calme, claire et professionnelle.","J'étudie le message avant de choisir formes, couleurs et typographie, car le sens doit mener l'esthétique. Cette méthode garantit que la beauté sert toujours la communication.","L'équilibre entre audace et retenue définit le style, et les formes fortes sont adoucies par un espacement propre. Le résultat est un design confiant sans être lourd.","Je construis des systèmes, pas des visuels isolés, pour que chaque élément puisse évoluer tout en restant cohérent. Cette expertise systémique rend le travail adaptable et durable.","La lumière, l'ombre et la texture sont utilisées avec subtilité pour donner de la profondeur sans encombrement. Le résultat est une pièce raffinée qui paraît moderne et tactile.","Je fais attention à la façon dont un design sera vu sur différents appareils, et je teste la lisibilité à chaque taille. Ce soin assure une expérience sans faute partout.","L'émotion est traduite en langage visuel à travers palette, rythme et forme. La pièce finale paraît vivante, chaleureuse et mémorable.","Je garde le processus transparent, des premiers croquis à la livraison finale, pour que la collaboration reste claire et fiable. Ce professionnalisme construit des relations à long terme.","Chaque projet commence avec une page blanche et une question claire : que doit faire ressentir et comprendre ce design. La réponse façonne chaque décision créative.","Je raffine jusqu'à ce que la composition paraisse sans effort, même quand le travail derrière est complexe. Cette aisance est la marque de la vraie expertise.","Les couleurs sont choisies pour soutenir l'identité, pas pour distraire, et les palettes sont construites pour harmonie et contraste. Le résultat est un v nition professionnelle.","Je conçois avec une perspective à long terme, en imaginant comment le travail va vieillir et évoluer. Cette prévoyance protège sa pertinence.","Le portfolio n'est pas seulement une collection, c'est une déclaration de valeurs : passion, créativité et professionnalisme. Chaque design incarne ces valeurs.","Je m'assure que chaque visuel respecte l'accessibilité, avec une typographie lisible et un contraste clair. Le design inclusif fait partie de la responsabilité professionnelle.","Chaque projet est traité comme unique, sans formule répétée aveuglément. Cette approche sur mesure garde chaque design frais et authentique.","J'utilise formes et objets pour créer des métaphores visuelles qui rendent les idées instantanément compréhensibles. Cette pensée créative ajoute de la profondeur au travail.","Le travail est motivé par le désir de rendre la communication meilleure, plus claire et plus humaine. Ce désir est visible dans chaque composition.","Je construis des designs qui paraissent confiants, car la confiance est construite sur la préparation et l'expertise. Le résultat est un travail qui inspire confiance.","Chaque palette, mise en page et choix typographique est pensé comme partie d'un système cohérent. Cette pensée systémique assure la cohérence.","Je crée des visuels qui peuvent être aimés au premier regard et respectés dans le temps. Cette combinaison d'attrait immédiat et de valeur durable est rare et intentionnelle.","Le portfolio invite le spectateur à explorer, à ressentir et à comprendre la pensée derrière chaque design. C'est une fenêtre ouverte sur un processus créatif.","J'utilise la retenue comme une force, sachant quand s'arrêter et quand un design est terminé. Ce jugement vient de l'expérience et du savoir faire.","Chaque design est un dialogue entre créateur, client et public, et ce dialogue est honoré dans chaque décision. Cet esprit collaboratif enrichit le résultat.","Je m'assure que le ratio original de chaque image est         @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Space+Grotesk:wght@700&display=swap');
        *{box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{margin:0; overflow-x:hidden}
        ::-webkit-scrollbar{width:12px; height:10px}
        ::-webkit-scrollbar-track{background:#0A1931}
        ::-webkit-scrollbar-thumb{background:#FFD700; border-radius:6px; border:2px solid #0A1931}
        ::-webkit-scrollbar-thumb:hover{background:#FFE55C}
        .scrollbar-yellow::-webkit-scrollbar{height:10px}
        .scrollbar-yellow::-webkit-scrollbar-thumb{background:#FFD700}
        .no-scrollbar-hide{scrollbar-width:thin; scrollbar-color:#FFD700 #0A1931}
        @keyframes fadeSlide{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:translateY(0)}}
        .fade-slide{animation:fadeSlide 0.5s ease}
        img{max-width:100%; height:auto}
        button{min-height:44px}
        .elegant-textbox{
          background: linear-gradient(135deg, #0A1931 0%, #000000 100%);
          border: 1px solid rgba(255,215,0,0.2);
          border-left: 5px solid #FFD700;
          border-radius: 0 0 12px 12px;
          box-shadow: 0 8px 32px rgba(0,0,0,0.4);
          transition: all 0.3s ease;
        }
        .elegant-textbox:hover{
          border-color: rgba(255,215,0,0.5);
          box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,215,0,0.3), 0 0 20px rgba(255,215,0,0.15);
        }
        /* CRITICAL FIX 2: blue comment names */
        .comment-name{
          color:#3B82F6 !important;
          font-weight:700 !important;
          font-size:14px !important;
          position:relative;
          display:inline-flex;
          align-items:center;
          gap:6px;
        }
        .comment-name::before{
          content:"";
          width:6px;
          height:6px;
          background:#3B82F6;
          border-radius:50%;
          display:inline-block;
          flex-shrink:0;
        }
        .comment-name:hover{
          text-decoration:underline;
          text-underline-offset:3px;
        }
        /* CRITICAL FIX 3: keep aspect ratio for designs */
        .design-image-wrap{
          width:100%;
          background:#000;
          display:flex;
          align-items:center;
          justify-content:center;
          overflow:hidden;
        }
        .design-image-wrap img{
          width:100% !important;
          height:auto !important;
          object-fit:contain !important;
          aspect-ratio:auto !important;
          max-height:none !important;
          display:block !important;
        }
        .preview-image-wrap{
          overflow:visible !important;
          width:100%;
          background:#000;
          display:flex;
          align-items:center;
          justify-content:center;
        }
        img.object-cover{object-fit:contain !important;}
        .preview-image-wrap img{
          min-height:0 !important;
          min-width:0 !important;
          width:100% !important;
          max-width:100% !important;
          height:auto !important;
          max-height:calc(90dvh - 150px) !important;
          object-fit:contain !important;
          aspect-ratio:auto !important;
          display:block !important;
        }
        @keyframes shakeAnim{
          0%,100%{transform:translateX(0)}
          20%,60%{transform:translateX(-6px)}
          40%,80%{transform:translateX(6px)}
        }
        .shake{
          animation:shakeAnim 0.35s ease;
        }
        .original-watermark{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff; font-weight:900; text-shadow:0 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6); letter-spacing:0.2px}
        .watermark-icon{width:18px; height:18px; border:1px solid #fff; border-radius:50%; vertical-align:middle; margin:0 4px; object-fit:cover; display:inline-block; flex-shrink:0}
        @media (min-width:768px){.watermark-icon{width:22px; height:22px}}
        .ceo-signature{max-width:520px; margin:14px auto 0; text-align:center; background:none; border:none; box-shadow:none; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
        .ceo-divider{width:40px; height:3px; background:#FFD700; border-radius:999px; margin:0 auto 10px}
        .ceo-title{font-weight:800; font-size:15.5px; color:#0A1931; letter-spacing:0.6px; line-height:1.35; margin:0}
        .ceo-title + .ceo-title{margin-top:2px}
        .ceo-subtitle{font-weight:600; font-size:13.5px; color:#4B5563; letter-spacing:0.2px; line-height:1.5; margin:6px 0 0}
        @media (min-width:768px){.ceo-title{font-size:17px} .ceo-subtitle{font-size:14.5px}}
        .contact-pill{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border-radius:999px; font-size:13px; font-weight:800; text-decoration:none; white-space:nowrap; line-height:1.2; transition:transform .18s ease, box-shadow .18s ease, filter .18s ease; box-sizing:border-box; max-width:100%}
